[env:esp32-s3-devkitc-1]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200

lib_deps = 
    dlloydev/QuickPID @ ^3.1.9
    bodmer/TFT_eSPI @ ^2.5.31
    madhephaestus/ESP32Encoder @ ^0.10.2

build_flags = 
    ; --- Hardware ESP32-S3 ---
    -D BOARD_HAS_PSRAM=0
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
    
    ; --- Configuración TFT ---
    -D USER_SETUP_LOADED=1
    -D ST7789_DRIVER=1
    -D TFT_WIDTH=240
    -D TFT_HEIGHT=320
    -D CGRAM_OFFSET=1      
    -D TFT_RGB_ORDER=TFT_BGR 
    
    ; --- Ruteo ESP32-S3 ---
    -D TFT_MOSI=11
    -D TFT_SCLK=12
    -D TFT_CS=10
    -D TFT_DC=9
    -D TFT_RST=8
    
    ; --- Fuentes y velocidad ---
    -D LOAD_GLCD=1
    -D LOAD_FONT2=1
    -D LOAD_FONT4=1
    -D SPI_FREQUENCY=27000000